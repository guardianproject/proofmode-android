
plugins {
    alias(libs.plugins.android.application) apply false
    alias(libs.plugins.android.library) apply false
    alias(libs.plugins.ksp) apply false
    alias(libs.plugins.kotlin.compose) apply false
    alias(libs.plugins.kotlin.serialization) apply false
    alias(libs.plugins.navigation.safeargs) apply false
    alias(libs.plugins.secrets) apply false
}

allprojects {
    repositories {
        mavenCentral()
        google()

        maven { url "https://jitpack.io" }

        mavenLocal()

        // Flutter artifacts (group: io.flutter) are published in this repo;
        // keep it scoped to io.flutter to avoid unnecessary lookups/conflicts.
        maven {
            name = "FlutterStorage"
            url = uri("https://storage.googleapis.com/download.flutter.io")
            content {
                includeGroup "io.flutter"
            }
        }


        maven { url "https://raw.githubusercontent.com/guardianproject/gpmaven/master" }

        // Talsec freeRASP (TalsecSecurity-Community) is only published here
        maven { url "https://europe-west3-maven.pkg.dev/talsec-artifact-repository/freerasp" }

	// Only org.contentauth is published here. Keep it scoped: this repo answers 401 (not 404)
        // for anything it doesn't serve, which aborts resolution of unrelated modules outright.
        maven {
        url = uri("https://maven.pkg.github.com/contentauth/c2pa-android")
        credentials {
            username = project.findProperty("gpr.user") ?: System.getenv("USERNAME")
            password = project.findProperty("gpr.key") ?: System.getenv("TOKEN")
        }
        content {
            includeGroup "org.contentauth"
        }
   }

    }



}

task clean(type: Delete) {
    delete rootProject.buildDir
}
