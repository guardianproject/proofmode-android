# Default secrets for ProofMode - safe to commit
# These values are used when secrets.properties is not present (e.g., CI builds)
# Replace with your own values in secrets.properties for local development

# CLOUD_INTEGRITY_PROJECT_NUMBER must be set in secrets.properties for Play
# Integrity to work.

# standard endpoint 
API_ENDPOINT=/api/v1/c2pa/configuration?platform=android

# public dev server with test certificates
SIGNING_SERVER=https://proofsign-dev.proofmode.org

# timestamp server
TSA_SERVER = http://timestamp.digicert.com

# Wallet SDK config (override in secrets.properties or local.properties for local use)
PRIVY_APP_ID=replace-me-privy-app-id
PRIVY_APP_CLIENT_ID=replace-me-privy-app-client-id

# ZeroDev gas sponsorship (https://dashboard.zerodev.app/)
# Set ZERODEV_PROJECT_ID to your dashboard project UUID. Bundler/paymaster RPC URLs
# are derived per chain as https://rpc.zerodev.app/api/v3/{projectId}/chain/{chainId}.
# Optional: override Base-mainnet RPC URLs explicitly (legacy keys, Base only):
ZERODEV_PROJECT_ID=replace-me-zerodev-project-id
ZERODEV_PROJECT_ID_BASE=replace-me-zerodev-project-id-base
ZERODEV_BUNDLER_URL_BASE=replace-me-zerodev-bundler-url-base
ZERODEV_PAYMASTER_URL_BASE=replace-me-zerodev-paymaster-url-base

# Privy test accounts:
PRIVY_TEST_EMAIL=<TEST_EMAIL>
PRIVY_TEST_PHONE_NUMBER=<TEST_PHONE_NUMBER>
PRIVY_TEST_OTP=<TEST_OTP>
