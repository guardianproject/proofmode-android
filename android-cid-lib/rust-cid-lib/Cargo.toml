[package]
name = "rust-cid-lib"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
name = "rust_cid_lib"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
rust-unixfs = "0.6"
cid = "0.11"
multihash = "0.19"
ipld-core = "0.4"
multihash-codetable = { version = "0.2", features = ["sha2"] }
uniffi = { version = "0.29", features = ["cli"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[build-dependencies]
uniffi = { version = "0.29", features = ["build"] }

[profile.release]
lto = true
codegen-units = 1
