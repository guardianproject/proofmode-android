// Proofmode compatibility shim for AGP 9 + Flutter add-to-app module integration.
//
// Why this exists:
// - flutter-location-protocol/.android/Flutter/build.gradle is generated by Flutter tooling.
// - With Flutter 3.41.x + AGP 9.x, applying `dev.flutter.flutter-gradle-plugin` in that generated
//   module can fail at configuration time with a NullPointerException.
// - Proofmode host build depends on `:flutter` for bridge compilation, so this shim keeps host
//   Android compilation unblocked.
//
// How to use:
// 1) Regenerate Flutter module artifacts as needed (flutter pub get / flutter build / etc).
// 2) Copy this file over `.android/Flutter/build.gradle`.
// 3) Re-run `./gradlew :plugin-location-protocol:compileDebugKotlin` (or Windows equivalent).

plugins {
    id "com.android.library"
}

def localProperties = new Properties()
def localPropertiesFile = new File(buildscript.sourceFile.parentFile.parentFile, "local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterSdkPath = localProperties.getProperty("flutter.sdk")
if (flutterSdkPath == null) {
    throw new GradleException("flutter.sdk not set in flutter-location-protocol/.android/local.properties")
}

group = "com.example.location_protocol_flutter"
version = "1.0"

def engineVersionFile = new File(flutterSdkPath, "bin/internal/engine.version")
if (!engineVersionFile.exists()) {
    throw new GradleException("Flutter engine.version not found at ${engineVersionFile.absolutePath}")
}
def engineVersion = engineVersionFile.text.trim()
def flutterStorageUrl = System.getenv("FLUTTER_STORAGE_BASE_URL") ?: "https://storage.googleapis.com"

repositories {
    google()
    mavenCentral()
    maven {
        url = uri("${flutterStorageUrl}/download.flutter.io")
    }
}

android {
    namespace = "com.example.location_protocol_flutter"
    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk = 24
        targetSdk = 36
    }
}

dependencies {
    implementation "androidx.annotation:annotation:1.9.1"
    debugApi "io.flutter:flutter_embedding_debug:1.0.0-${engineVersion}"
    debugImplementation "io.flutter:armeabi_v7a_debug:1.0.0-${engineVersion}"
    debugImplementation "io.flutter:arm64_v8a_debug:1.0.0-${engineVersion}"
    debugImplementation "io.flutter:x86_debug:1.0.0-${engineVersion}"
    debugImplementation "io.flutter:x86_64_debug:1.0.0-${engineVersion}"

    releaseApi "io.flutter:flutter_embedding_release:1.0.0-${engineVersion}"
    releaseImplementation "io.flutter:armeabi_v7a_release:1.0.0-${engineVersion}"
    releaseImplementation "io.flutter:arm64_v8a_release:1.0.0-${engineVersion}"
    releaseImplementation "io.flutter:x86_64_release:1.0.0-${engineVersion}"
}
