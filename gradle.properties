# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx10248m -XX:MaxPermSize=256m
#org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.jvmargs=-Xmx4096M

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
aar.deployPath=/home/n8fr8/dev/repos/gpmaven
android.useAndroidX=true
android.enableJetifier=true
android.injected.testOnly=false
# Disabled: Flutter's DependencyVersionChecker registers :flutter:<Variant>MinSdkCheck with a
# task action that captures Project, JavaCompile and AndroidUnitTest instances in its closure,
# none of which the configuration cache can serialize. `problems=warn` does not help either --
# the resulting store failure is fatal. Re-enable once the Flutter Gradle plugin is CC-compatible.
org.gradle.configuration-cache=false

# Allow KSP to use kotlin.sourceSets DSL with built-in Kotlin in AGP 9.0+
android.disallowKotlinSourceSets=false

# Flutter's Gradle plugin (add-to-app :flutter module, flutter-location-protocol)
# still uses AGP's legacy DSL (BaseExtension). AGP 9 only registers the new DSL
# by default, which makes Flutter's getLegacyAndroidExtension() NPE. Re-enable the
# legacy DSL types for compatibility. Not android.builtInKotlin=false: this repo
# already uses built-in Kotlin (no kotlin-android plugin), so that stays on.
# https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin/for-app-developers
android.newDsl=false
